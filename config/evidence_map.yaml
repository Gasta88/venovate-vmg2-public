# Evidence role declaration per pulled count (issue-53 D-03/WI-05).
#
# role: driver  — the count feeds a sizing assumption (`feeds:` names the
#                 assumptions.csv parameter);
#       context — ecosystem signal, prose only, never a sizing input;
#       n/a     — no meaningful source for this package × source; documented
#                 here, NOT pulled (the cell is omitted from queries.yaml).
#
# `claim` is the prose-claim anchor: what the count is allowed to evidence in
# the report (AC-4 spot-check target — no count may be used as evidence for
# something its query doesn't measure). D-26 boundary: ClinicalTrials.gov
# counts are context only — a ctgov claim anchor never reads as evidence of
# commercial demand, and overlapping package records are disclosed, never
# summed (scripts/check_claims.py enforces). Resolved into coverage.csv's `role`
# column by scripts/build_tables.py (package × source level; openalex
# dimensions may differ per row — the most load-bearing dimension wins).
# Snapshot: data/raw/*/<date>/ per config/queries.yaml (retuned 2026-10-05).

- {package: p1_venospatial, source: openalex, dimension: authorships.institutions.id,
   role: driver, feeds: p1.tam.institutes,
   claim: "institutions publishing spatial-omics work anchor the institute count"}
- {package: p1_venospatial, source: openalex, dimension: publication_year, role: context,
   claim: "spatial-omics activity level (works/yr); adoption signal only"}
- {package: p1_venospatial, source: openalex, dimension: authorships.countries, role: context,
   claim: "geographic spread of spatial-omics output"}
- {package: p1_venospatial, source: ctgov, role: context,
   claim: "omics-heavy interventional trial activity is ecosystem context;
           never evidence of commercial demand for assays"}
- {package: p1_venospatial, source: cordis, role: context,
   claim: "EU-funded multi-omics/spatial-omics projects size the funded landscape"}

