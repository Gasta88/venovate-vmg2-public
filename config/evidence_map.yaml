- {package: p2_insilico_workshop, source: ctgov, role: n/a,
   basis: "clinical-trial counts do not measure training demand (D-03: documented, not
           pulled; cell omitted from queries.yaml per the issue-53 queries contract)"}
- {package: p2_insilico_workshop, source: cordis, role: context,
   claim: "EU doctoral-network/training actions evidence a funded training market"}

